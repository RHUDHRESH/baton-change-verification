[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baton-departure"
version = "0.2.0"
description = "Evidence-backed departure rehearsal with FalkorDB"
requires-python = ">=3.10"
dependencies = ["falkordb==1.8.0", "redis==8.1.0", "fastapi==0.143.3", "uvicorn==0.54.0", "mcp==2.3.0", "openai==3.35.1"]

[project.scripts]
baton = "baton.__main__:main"

[tool.setuptools.packages.find]
include = ["baton*", "server*", "third_party*"]

[tool.setuptools.package-data]
third_party = ["amb/LICENSE"]
server = ["release_dependency_lock.json"]

[tool.setuptools.data-files]
"share/baton/web" = ["web/index.html", "web/app.js", "web/extensions.js", "web/styles.css", "web/amb.html", "web/amb.js", "web/amb.css", "web/benchmark.html", "web/benchmark.js", "web/benchmark.css", "web/rehearsal.html", "web/public.html", "web/public.js", "web/company.js", "web/workflows.js", "web/release-verification.js", "web/release-verification.css", "web/public.css", "web/sandbox.html"]
"share/baton/web/samples" = ["web/samples/*.json"]
"share/baton/web/vendor/cytoscape" = ["web/vendor/cytoscape/*.js", "web/vendor/cytoscape/LICENSE", "web/vendor/cytoscape/*.json"]
"share/baton/fixtures/extract_cache" = ["fixtures/extract_cache/*.json"]
"share/baton/fixtures/lane_a_cache" = ["fixtures/lane_a_cache/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/test_phase_one.py", "tests/locked/M01"]
pythonpath = [".", "tests/support"]
addopts = "-ra"
