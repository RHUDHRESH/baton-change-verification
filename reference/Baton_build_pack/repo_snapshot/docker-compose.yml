services:
  falkordb:
    image: falkordb/falkordb:v4.22.1   # pinned: CCH/maxFlow behaviour verified on this version
    ports: ["127.0.0.1:6379:6379", "127.0.0.1:3000:3000"]   # 3000 = FalkorDB Browser (judge view, local only)
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: deploy/Dockerfile }
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BATON_OFFLINE: ${BATON_OFFLINE:-1}
    ports: ["8000:8000"]
    depends_on: [falkordb]
    restart: unless-stopped
